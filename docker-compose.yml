services:

# servicios de aplicación
  home:
    build: ./home
    ports:
      - "8080:80"
      
  clientes:
    build: ./clientes # Construye la imagen del microservicio de clientes desde la carpeta ./clientes
    ports:
      - "5002:5000" # Mapeo de puertos: expone la API en el puerto
    env_file:
      - .env # Carga automáticamente las variables de entorno
    depends_on:
      - mysql_clientes ## Garantiza que el contenedor de base de datos de clientes inicie antes que este servicio

  hoteles:
    build: ./hoteles
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - mysql_hoteles
# Bases de datos correspondientes
  mysql_clientes:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clientes # Crea automáticamente la base de datos al iniciar 
    ports:
      - "3306:3306" # Expone MySQL en el puerto estándar 3306 de tu máquina para gestión externa
    volumes:
      - mysql_clientes_data:/var/lib/mysql # Persistencia: asegura que los datos no se pierdan al reiniciar el contenedor

  mysql_hoteles:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hoteles
    ports:
      - "3307:3306"
    volumes:
      - mysql_hoteles_data:/var/lib/mysql

volumes:
  mysql_clientes_data:
  mysql_hoteles_data:



  